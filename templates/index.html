<!DOCTYPE html>
<html>
<head>
    <title>Calculadora Parabólica</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        form { margin: 20px 0; }
        input { margin: 5px; padding: 5px; }
        button { padding: 8px 15px; margin: 10px 0; }
        .resultado { margin-top: 20px; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h2>Calculadora Parabólica</h2>
    
    <form onsubmit="calcular(event)">
        <div>
            <label>Distancia (m):</label>
            <input type="number" id="distance" value="20" step="0.1" required>
        </div>
        <div>
            <label>Altura (m):</label>
            <input type="number" id="height" value="10" step="0.1" required>
        </div>
        <button type="submit">Calcular</button>
    </form>

    <div id="resultado" class="resultado" style="display:none">
        <h3>Resultados:</h3>
        <p>Ángulo: <span id="degrees">--</span> grados</p>
        <p>Velocidad: <span id="speed">--</span> m/s</p>
    </div>

    <script>
        async function calcular(event) {
            event.preventDefault();
            
            const distance = parseFloat(document.getElementById('distance').value);
            const height = parseFloat(document.getElementById('height').value);
            
            try {
                const response = await fetch('/parabolicComponents', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({distance: distance, height: height})
                });
                
                const data = await response.json();
                
                document.getElementById('degrees').textContent = data.degrees.toFixed(2);
                document.getElementById('speed').textContent = data.speed.toFixed(2);
                document.getElementById('resultado').style.display = 'block';
                
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
